<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WheelVision — Full Product Prototype</title>
<style>
:root{--bg:#0b0d12;--s:#11151d;--s2:#171c26;--l:#2b3343;--t:#f5f7fb;--m:#9ca6b8;--b:#5b8cff;--v:#9a6cff;--g:#44c98a;--r:18px;--max:1180px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.55 Inter,system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:#0b0d12ee;border-bottom:1px solid var(--l);backdrop-filter:blur(12px)}.hi,.c{max-width:var(--max);margin:auto;padding:18px 24px}.hi{display:flex;gap:22px;align-items:center}.brand{font-weight:800;font-size:20px}.nav{display:flex;gap:6px;flex:1;overflow:auto}.nav button{border:0;background:transparent;color:var(--m);padding:9px 11px;border-radius:10px}.nav button.a{background:var(--s2);color:var(--t)}.credits{white-space:nowrap;color:var(--m)}main{flex:1}.c{padding-top:54px;padding-bottom:72px}
h1,h2,h3,p{margin-top:0}h1{font-size:clamp(40px,6vw,72px);line-height:1;letter-spacing:-.045em;margin-bottom:18px}h2{font-size:32px;letter-spacing:-.025em}h3{font-size:20px}p{color:var(--m)}.ey{color:#b6c7ff;text-transform:uppercase;letter-spacing:.12em;font-size:13px;margin-bottom:14px}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center}.hero p{font-size:19px}.card{background:var(--s);border:1px solid var(--l);border-radius:var(--r);padding:20px}.media{aspect-ratio:3/2;border-radius:14px;overflow:hidden;background:var(--s2);border:1px solid var(--l);position:relative}.media img{width:100%;height:100%;object-fit:cover;display:block}.fb{display:grid;place-items:center;width:100%;height:100%;color:var(--m);text-align:center;padding:20px}
.badge{position:absolute;left:14px;bottom:14px;background:#0b0d12e8;border:1px solid var(--l);border-radius:12px;padding:9px 11px}.badge strong{display:block;font-size:26px}.btn{border:1px solid var(--l);background:var(--s2);color:var(--t);padding:11px 16px;border-radius:11px;font-weight:700;min-height:44px}.btn.p{border:0;background:linear-gradient(135deg,var(--b),var(--v))}.btn.g{background:transparent}.btn.s{padding:7px 10px;min-height:36px;font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.section{margin-top:64px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.head{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:28px}.head h1{font-size:48px}.gen{display:grid;grid-template-columns:1fr 1fr;gap:18px}.dz{border:1.5px dashed #46516a;border-radius:15px;min-height:235px;display:grid;place-items:center;text-align:center;padding:20px;background:#0e1218}.samples{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.sample{border:1px solid var(--l);background:var(--s2);color:var(--t);border-radius:11px;padding:7px;text-align:left}.sample.sel{border-color:var(--b)}.sample .media{aspect-ratio:1;margin-bottom:6px}
.progress{height:6px;background:var(--s2);border-radius:999px;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,var(--b),var(--v));width:0;transition:width .35s}.steps{display:grid;gap:10px;margin-top:15px}.step{border:1px solid var(--l);border-radius:11px;padding:12px 14px}.step.done{border-color:#2c6650}.step.active{border-color:var(--b)}
.result{display:grid;grid-template-columns:1.2fr .8fr;gap:24px}.seg{display:inline-flex;padding:4px;border:1px solid var(--l);border-radius:999px;background:var(--s);margin-bottom:12px}.seg button{border:0;background:transparent;color:var(--m);padding:8px 14px;border-radius:999px}.seg button.a{background:var(--s2);color:var(--t)}.score{font-size:76px;font-weight:900;letter-spacing:-.05em;line-height:1}.score small{font-size:20px;color:var(--m)}.meter{height:9px;background:var(--s2);border-radius:999px;overflow:hidden}.meter div{height:100%;background:linear-gradient(90deg,var(--b),var(--v))}
.gallery,.pricing,.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}.poll{display:grid;grid-template-columns:1fr 1fr;gap:16px}.poll>button,.poll>div{border:1px solid var(--l);background:var(--s);color:var(--t);border-radius:16px;padding:12px;text-align:left}.poll .sel{border-color:var(--b)}.bar{height:8px;background:var(--s2);border-radius:999px;overflow:hidden}.bar div{height:100%;background:var(--b)}
.price{font-size:42px;font-weight:900}.price small{font-size:15px;color:var(--m)}ul{padding:0;list-style:none;color:var(--m)}li{margin:9px 0}li:before{content:"✓ ";color:var(--g)}.motion{min-height:300px;display:grid;place-items:center;text-align:center}.wheel{width:120px;height:120px;border:10px solid #aeb7c7;border-radius:50%;animation:spin 1.3s linear infinite;position:relative}.wheel:after{content:"";position:absolute;inset:36px;background:#aeb7c7;border-radius:50%}@keyframes spin{to{transform:rotate(360deg)}}footer{border-top:1px solid var(--l);color:var(--m)}.toast{position:fixed;right:18px;bottom:18px;background:var(--s2);border:1px solid var(--l);border-radius:11px;padding:12px 14px;z-index:20}
@media(max-width:900px){.hero,.gen,.result,.g2{grid-template-columns:1fr}.g3,.gallery,.pricing,.packs{grid-template-columns:1fr 1fr}.nav{display:none}}@media(max-width:620px){.c{padding:36px 18px 56px}.hi{padding:14px 18px}.g3,.gallery,.pricing,.packs,.poll{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.head h1{font-size:40px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head><body><div class="shell">
<header><div class="hi"><div class="brand">◉ WheelVision</div><nav class="nav" id="nav"></nav><div class="credits"><b id="cr">5</b> credits</div></div></header>
<main id="app"></main><footer><div class="c" style="padding-top:22px;padding-bottom:22px">Full-product concept prototype. AI, payments, storage and public links are simulated.</div></footer>
</div>
<script>
const A={car:"assets/car-sample.jpg",white:"assets/result-white.jpg",bronze:"assets/result-bronze.jpg",gunmetal:"assets/result-gunmetal.jpg",ww:"assets/wheels-white.jpg",wb:"assets/wheels-bronze.jpg",wg:"assets/wheels-gunmetal.jpg"};
const S={credits:5,car:null,wheel:null,result:"white",name:"White",score:8.7,plan:"Free",gallery:[["White wheels",A.white,8.7],["Bronze wheels",A.bronze,9.3],["Gunmetal wheels",A.gunmetal,9.0]],vote:null,va:18,vb:27};
const routes=[["#/","Home"],["#/generator","Generator"],["#/garage","Garage"],["#/polls","Polls"],["#/pricing","Pricing"],["#/account","Account"]];
const app=document.getElementById("app"),nav=document.getElementById("nav"),cr=document.getElementById("cr");
function img(src,alt){let n=src.split("/").pop();return `<div class="media"><img src="${src}" alt="${alt}" data-f="${n}"><div class="fb" hidden>${n}</div></div>`}
function fall(scope=document){scope.querySelectorAll("img[data-f]").forEach(i=>{let f=i.nextElementSibling;let x=()=>{i.hidden=1;f.hidden=0};i.onerror=x;if(i.complete&&!i.naturalWidth)x()})}
function toast(t){document.querySelector(".toast")?.remove();let e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
function go(h){location.hash=h}
function navr(){let h=location.hash||"#/";nav.innerHTML=routes.map(r=>`<button class="${h===r[0]?"a":""}" data-h="${r[0]}">${r[1]}</button>`).join("");nav.querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.h));cr.textContent=S.credits}
function route(){navr();let h=location.hash||"#/";({ "#/":home,"#/generator":generator,"#/result":result,"#/garage":garage,"#/polls":polls,"#/poll-create":pollCreate,"#/poll-view":pollView,"#/pricing":pricing,"#/account":account,"#/motion":motion}[h]||home)();fall(app);scrollTo(0,0)}
addEventListener("hashchange",route);

function home(){app.innerHTML=`<div class="c"><section class="hero"><div><div class="ey">Visual certainty before purchase</div><h1>See the wheels before you buy them.</h1><p>Upload your car and the exact wheel you are considering. WheelVision creates a realistic preview and adds a 1–10 Harmony Score with a simple explanation.</p><div class="actions"><button class="btn p" id="start">Try a render</button><button class="btn g" id="sample">Open sample result</button></div></div><div class="card">${img(A.white,"Sample WheelVision render")}<div class="badge"><strong>8.7</strong>Harmony Score</div></div></section>
<section class="section"><div class="ey">Core user needs</div><h2>Confidence without learning wheel theory.</h2><div class="g3"><div class="card"><h3>Visual certainty</h3><p>See a specific wheel on your own car before purchase.</p></div><div class="card"><h3>Lower decision anxiety</h3><p>Reduce the risk of an expensive aesthetic mistake.</p></div><div class="card"><h3>Aesthetic validation</h3><p>Use a score and plain-language explanation for reassurance.</p></div></div></section>
<section class="section"><div class="g3"><div class="card"><h3>Garage</h3><p>Save render history and revisit configurations.</p><button class="btn s" onclick="go('#/garage')">Open Garage</button></div><div class="card"><h3>Polls</h3><p>Compare Wheel A vs. Wheel B and collect votes.</p><button class="btn s" onclick="go('#/polls')">See polls</button></div><div class="card"><h3>Motion preview</h3><p>Concept for GIF/video wheel motion.</p><button class="btn s" onclick="go('#/motion')">Preview motion</button></div></div></section></div>`;start.onclick=()=>go("#/generator");sample.onclick=()=>go("#/result")}

function dz(type){return `<div class="dz"><div><b>Choose ${type} photo</b><p>JPG or PNG</p><input type="file" accept="image/jpeg,image/png" id="${type}i"><button class="btn s" id="${type}b">Browse</button></div></div>`}
function pv(type,o){return `${img(o.src,`${type} preview`)}<div class="meta"><b>${o.name}</b><button class="btn s" id="${type}r">Replace</button><input type="file" accept="image/jpeg,image/png" id="${type}i" hidden></div>`}
function sm(label,src,id){return `<button class="sample ${S.result===id?"sel":""}" data-id="${id}">${img(src,label+" wheel")}<b>${label}</b></button>`}
function setup(type){let i=document.getElementById(type+"i");if(!i)return;document.getElementById(type+"b")?.addEventListener("click",()=>i.click());document.getElementById(type+"r")?.addEventListener("click",()=>i.click());i.onchange=()=>{let f=i.files[0];if(!f)return;if(!["image/jpeg","image/png"].includes(f.type)){toast("Use JPG or PNG.");return}if(f.size>10485760){toast("Image must be under 10 MB.");return}S[type]={src:URL.createObjectURL(f),name:f.name};if(type==="wheel"){S.result="white";S.score=8.7;S.name="Custom"}generator()}}
function generator(){app.innerHTML=`<div class="c"><div class="head"><div><div class="ey">AI Visualization Engine</div><h1>Photo Generator</h1><p>Upload a car and a wheel. Segmentation, perspective alignment, compositing and scoring are simulated.</p></div><div>1 render = 1 credit</div></div><div class="gen"><div class="card"><h3>1. Car photo</h3>${S.car?pv("car",S.car):dz("car")}</div><div class="card"><h3>2. Wheel photo</h3>${S.wheel?pv("wheel",S.wheel):dz("wheel")}<div class="samples">${sm("White",A.ww,"white")}${sm("Bronze",A.wb,"bronze")}${sm("Gunmetal",A.wg,"gunmetal")}</div></div></div><div class="actions"><button class="btn p" id="gen">Generate preview</button><button class="btn g" id="use">Use sample car + wheel</button></div><div id="proc"></div></div>`;fall(app);setup("car");setup("wheel");use.onclick=()=>{S.car={src:A.car,name:"car-sample.jpg"};S.wheel={src:A.ww,name:"wheels-white.jpg"};S.result="white";S.name="White";S.score=8.7;generator()};document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{let m={white:["White",A.ww,8.7],bronze:["Bronze",A.wb,9.3],gunmetal:["Gunmetal",A.wg,9.0]}[b.dataset.id];S.wheel={src:m[1],name:m[1].split("/").pop()};S.result=b.dataset.id;S.name=m[0];S.score=m[2];generator()});gen.onclick=process}
function process(){if(!S.car||!S.wheel){toast("Add both photos first.");return}if(S.credits<1){go("#/pricing");return}S.credits--;navr();proc.innerHTML=`<div class="card section"><h3>Creating preview</h3><div class="progress"><div id="pb"></div></div><div class="steps"><div class="step active" id="s1">Segmenting car and wheel</div><div class="step" id="s2">Aligning perspective</div><div class="step" id="s3">Compositing and scoring</div></div></div>`;let p=0,t=setInterval(()=>{p+=10;pb.style.width=p+"%";if(p>=100)clearInterval(t)},160);setTimeout(()=>{s1.className="step done";s2.className="step active"},600);setTimeout(()=>{s2.className="step done";s3.className="step active"},1200);setTimeout(()=>{S.gallery.unshift([S.name+" wheels",A[S.result],S.score]);go("#/result")},1800)}

function result(){let d={white:["That is a striking combination.","Bright white creates immediate contrast against the purple body."],bronze:["A warm, confident match.","Bronze complements purple while keeping the car grounded."],gunmetal:["Subtle and cohesive.","Gunmetal keeps contrast low for a premium, understated look."]}[S.result];app.innerHTML=`<div class="c"><div class="head"><div><div class="ey">Render complete</div><h1>Your preview</h1></div><div>Saved to Garage</div></div><div class="result"><div><div class="seg"><button id="bef">Before</button><button class="a" id="aft">After</button></div><div id="rm">${img(A[S.result],"Render result")}</div></div><div class="card"><div class="score">${S.score.toFixed(1)} <small>/ 10</small></div><p>Harmony Score</p><div class="meter"><div style="width:${S.score*10}%"></div></div><h2 style="margin-top:24px">${d[0]}</h2><p>${d[1]}</p><div class="actions"><button class="btn p" id="another">Try another wheel</button><button class="btn" id="poll">Create poll</button><button class="btn g" id="mot">Motion preview</button></div></div></div></div>`;bef.onclick=()=>{rm.innerHTML=img(A.car,"Original car");fall(rm);bef.className="a";aft.className=""};aft.onclick=()=>{rm.innerHTML=img(A[S.result],"Render result");fall(rm);aft.className="a";bef.className=""};another.onclick=()=>go("#/generator");poll.onclick=()=>go("#/poll-create");mot.onclick=()=>go("#/motion")}

function garage(){app.innerHTML=`<div class="c"><div class="head"><div><div class="ey">Render history</div><h1>Garage</h1><p>Saved renders for review, comparison and polls.</p></div><button class="btn p" onclick="go('#/generator')">New render</button></div><div class="gallery">${S.gallery.map((x,i)=>`<div class="card">${img(x[1],x[0])}<div class="meta"><div><b>${x[0]}</b><p>${x[2].toFixed(1)} Harmony Score</p></div><button class="btn s" data-open="${i}">Open</button></div></div>`).join("")}</div></div>`;document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{let x=S.gallery[+b.dataset.open];S.score=x[2];S.result=x[1].includes("bronze")?"bronze":x[1].includes("gunmetal")?"gunmetal":"white";go("#/result")})}
function polls(){app.innerHTML=`<div class="c"><div class="head"><div><div class="ey">Social validation</div><h1>Polls</h1><p>Create A/B wheel comparisons and collect votes.</p></div><button class="btn p" onclick="go('#/poll-create')">Create poll</button></div><div class="g2"><div class="card"><h3>White vs. Bronze</h3><div class="poll"><div>${img(A.white,"White wheels")}<b>White</b></div><div>${img(A.bronze,"Bronze wheels")}<b>Bronze</b></div></div><div class="actions"><button class="btn s" onclick="go('#/poll-view')">View poll</button></div></div><div class="card"><h3>Growth loop</h3><p>User → Poll → Share → New users → New renders → New polls.</p></div></div></div>`}
function pollCreate(){app.innerHTML=`<div class="c"><div class="head"><div><div class="ey">New comparison</div><h1>Create a poll</h1><p>Choose two Garage renders.</p></div></div><div class="poll"><div>${img(A.white,"White")}<h3>Option A — White</h3></div><div>${img(A.bronze,"Bronze")}<h3>Option B — Bronze</h3></div></div><div class="actions"><button class="btn p" id="pub">Create public poll link</button></div></div>`;pub.onclick=()=>{toast("Public poll link created.");setTimeout(()=>go("#/poll-view"),400)}}
function pollView(){let t=S.va+S.vb,pa=Math.round(S.va/t*100),pb=100-pa;app.innerHTML=`<div class="c"><div class="head"><div><div class="ey">Public poll</div><h1>Which wheel works better?</h1></div><button class="btn s" id="copy">Copy public link</button></div><div class="poll"><button class="${S.vote==="a"?"sel":""}" data-v="a">${img(A.white,"White")}<h3>White</h3><p>${pa}% · ${S.va} votes</p><div class="bar"><div style="width:${pa}%"></div></div></button><button class="${S.vote==="b"?"sel":""}" data-v="b">${img(A.bronze,"Bronze")}<h3>Bronze</h3><p>${pb}% · ${S.vb} votes</p><div class="bar"><div style="width:${pb}%"></div></div></button></div></div>`;document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{if(S.vote)return;S.vote=b.dataset.v;b.dataset.v==="a"?S.va++:S.vb++;pollView()});copy.onclick=()=>toast("Share link copied.")}

function plan(n,p,s,items){return `<div class="card"><h3>${n}</h3><div class="price">${p} <small>${s}</small></div><ul>${items.map(i=>`<li>${i}</li>`).join("")}</ul><button class="btn ${n==="Standard"?"p":""}" data-plan="${n}">Choose ${n}</button></div>`}
function pricing(){app.innerHTML=`<div class="c"><div class="head"><div><div class="ey">Monetization</div><h1>Pricing</h1><p>Credit bundles and subscriptions.</p></div></div><div class="pricing">${plan("Free","$0","",["4–5 starter credits","Basic rendering"])}${plan("Standard","$4.99","/ month",["50 credits","Polls","Sharing tools"])}${plan("Pro","$9.99","/ month",["150 credits","Priority processing","No watermark"])}</div><section class="section"><h2>Credit packs</h2><div class="packs"><div class="card"><h3>20 credits</h3><div class="price">$2.99</div><p>Valid for 7 days.</p><button class="btn" data-buy="20">Buy credits</button></div><div class="card"><h3>60 credits</h3><div class="price">$5.99</div><p>Valid for 30 days.</p><button class="btn" data-buy="60">Buy credits</button></div><div class="card"><h3>High-quality render</h3><div class="price">$2.99</div><p>Single pay-per-use render.</p><button class="btn" data-buy="1">Buy render</button></div></div></section></div>`;document.querySelectorAll("[data-plan]").forEach(b=>b.onclick=()=>{S.plan=b.dataset.plan;if(S.plan==="Standard")S.credits+=50;if(S.plan==="Pro")S.credits+=150;navr();toast("Payment simulated.")});document.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{S.credits+=+b.dataset.buy;navr();toast("Credits added. Payment simulated.")})}
function account(){app.innerHTML=`<div class="c"><div class="head"><div><div class="ey">User cabinet</div><h1>Account</h1><p>Plan and credit management concept.</p></div></div><div class="g2"><div class="card"><h3>Profile</h3><p>alex@example.com</p><button class="btn" id="save">Save changes</button></div><div class="card"><h3>Plan</h3><div class="price">${S.plan}</div><p>${S.credits} credits available.</p><button class="btn p" onclick="go('#/pricing')">Manage plan</button></div></div></div>`;save.onclick=()=>toast("Profile changes saved locally.")}
function motion(){app.innerHTML=`<div class="c"><div class="head"><div><div class="ey">Motion visualization</div><h1>Motion preview</h1><p>Concept state for GIF or short-video generation.</p></div></div><div class="card motion"><div><div class="wheel"></div><h3 style="margin-top:20px">Motion preview simulation</h3><p>No media is generated in this prototype.</p></div></div><div class="actions"><button class="btn p" id="gm">Generate motion</button><button class="btn g" onclick="go('#/result')">Back to result</button></div></div>`;gm.onclick=()=>toast("Motion generation simulated.")}
route();
</script></body></html>
